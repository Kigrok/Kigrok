name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
concurrency:
  group: metrics
  cancel-in-progress: false
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: python-pro
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repo-python-pro.svg
          template: repository
          user: Kigrok
          repo: python-pro
          base: header
          plugin_languages: yes
          plugin_languages_details: percentage

      - name: obsidian-library-plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repo-obsidian-library-plugin.svg
          template: repository
          user: Kigrok
          repo: obsidian-library-plugin
          base: header
          plugin_languages: yes
          plugin_languages_details: percentage

      - name: api-key-checker
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repo-api-key-checker.svg
          template: repository
          user: Kigrok
          repo: api-key-checker
          base: header
          plugin_languages: yes
          plugin_languages_details: percentage

      - name: Nexul
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repo-nexul.svg
          template: repository
          user: Kigrok
          repo: Nexul
          base: header
          plugin_languages: yes
          plugin_languages_details: percentage
